<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clothoid ornament board</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f1e4;
    --card: #fffdf7;
    --ink: #2e2413;
    --muted: #7b6c4e;
    --gold: #8c6a21;
    --line: #d8ccae;
    --accent: #b23a2b;
    --good: #2f6f4e;
    --field: #fbf8ee;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "EB Garamond", Georgia, "Palatino Linotype", Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1100px 520px at 12% -8%, #fcf9ef 0, transparent 60%),
      var(--paper);
    color: var(--ink);
    font: 15px/1.45 var(--serif);
  }
  header {
    max-width: 1180px;
    margin: 0 auto;
    padding: 34px 22px 14px;
    border-bottom: 2px solid var(--ink);
  }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.01em; }
  .lead { margin: 0; color: var(--gold); font-size: 15px; max-width: 70ch; }
  .backrow { margin: 0 0 8px; }
  .backrow a, .subpage a { color: var(--gold); font: 12px/1.4 var(--mono); text-decoration: underline; text-underline-offset: 3px; }
  .subpage { margin: 12px 0 0; font-size: 14px; }
  .subpage a { font-size: 13px; }
  .groupwrap { display: flex; align-items: center; gap: 6px; }
  .legend { margin: 10px 0 0; font: 11px/1.6 var(--mono); color: var(--muted); }
  .legend b { color: var(--ink); }
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    max-width: 1180px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 22px;
    background: rgba(246, 241, 228, 0.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .toolbar label { font: 10px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  select, button, input {
    font: 12px/1 var(--mono);
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 9px;
    min-height: 34px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--ink); color: #fbf8ef; border-color: var(--ink); }
  .spacer { flex: 1; }
  .count { font: 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 22px 70px; }
  .summary {
    display: flex; flex-wrap: wrap; gap: 14px 26px;
    padding: 14px 16px; margin: 0 0 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 5px;
  }
  .definitions { margin: 0 0 18px; }
  .definitions > summary {
    cursor: pointer; font: 600 11px/1.2 var(--mono);
    letter-spacing: .10em; text-transform: uppercase; color: var(--muted);
    padding: 8px 0;
  }
  .definition-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px; margin-top: 8px;
  }
  .def {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: 11px 12px;
  }
  .def b {
    display: block; font: 600 12px/1.2 var(--mono);
    letter-spacing: .04em; color: var(--ink); margin-bottom: 4px;
  }
  .def p { margin: 0; font-size: 13px; line-height: 1.5; color: #4a4335; }
  .summary h2 { margin: 0 0 4px; font: 600 10px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .summary p { margin: 0; }
  .nextchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font: 11px/1 var(--mono); padding: 5px 7px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--field);
  }
  .chip b { color: var(--gold); font-weight: 600; }
  .decisions { margin: 0 0 18px; }
  .decisions > summary {
    cursor: pointer; font: 600 11px/1.2 var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    padding: 8px 0;
  }
  .decision-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .decision {
    background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 12px;
  }
  .decision .did { font: 10px/1 var(--mono); color: var(--gold); letter-spacing: .08em; }
  .decision h3 { margin: 5px 0 2px; font-size: 15px; }
  .decision p { margin: 0 0 8px; font: 12px/1.45 var(--serif); color: var(--muted); }
  .decision .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .decision .opt {
    font: 11px/1 var(--mono); padding: 6px 8px; min-height: 30px;
    background: var(--field); border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  }
  .decision .opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fbf8ef; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .groupbrief {
    background: var(--card); border: 1px solid var(--line); border-radius: 5px;
    padding: 14px 16px; margin: 0 0 14px;
  }
  .groupbrief h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .groupbrief p { margin: 0; font-size: 14px; line-height: 1.55; color: #4a4335; max-width: 95ch; }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; position: relative;
    scroll-margin-top: 64px;
  }
  .card.dragging { opacity: .45; }
  .card.drop-target { outline: 2px dashed var(--gold); outline-offset: 2px; }
  .card-top { display: flex; align-items: center; gap: 7px; }
  .pid {
    font: 10px/1 var(--mono); letter-spacing: .08em; color: var(--gold);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 5px; background: var(--field);
  }
  .kind { font: 10px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .grab { margin-left: auto; cursor: grab; color: var(--muted); font: 13px/1 var(--mono); padding: 2px 4px; }
  .moves { display: flex; gap: 3px; }
  .moves button { min-height: 28px; padding: 4px 7px; font-size: 13px; line-height: 1; }
  .thumb {
    display: block; width: 100%; margin: 8px 0 2px; padding: 4px;
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    cursor: zoom-in; overflow: hidden;
  }
  .thumb svg { display: block; width: 100%; height: auto; max-height: 320px; }
  .card h3 { margin: 7px 0 2px; font-size: 16px; font-weight: 600; line-height: 1.25; }
  .note { margin: 0 0 5px; font-size: 13px; color: #5a4a28; }
  .note-edit {
    width: 100%; margin: 0 0 3px; padding: 5px 6px;
    border: 1px dashed transparent; border-radius: 4px;
    background: transparent; color: #5a4a28;
    font: 13px/1.45 var(--serif);
    min-height: 76px; max-height: 280px; overflow: auto;
    resize: vertical;
  }
  .note-edit:hover { border-color: var(--line); }
  .note-edit:focus { border-color: var(--gold); background: var(--field); outline: none; }
  .note-reset {
    align-self: flex-start; border: 0; background: none; padding: 0 0 3px;
    color: var(--gold); font: 10px/1 var(--mono); cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .stats { margin: 0 0 7px; font: 10px/1.5 var(--mono); color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .rowlabel { font: 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); width: 44px; flex: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 3px; }
  .seg button {
    min-height: 30px; min-width: 30px; padding: 5px 7px;
    font: 11px/1 var(--mono); border-radius: 4px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fbf8ef; border-color: var(--ink); }
  .seg button.stage[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
  .seg button.stage.foundational[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
  .seg button.stage.finished[aria-pressed="true"] { background: #55503f; border-color: #55503f; }
  .memo {
    width: 100%; margin-top: 8px; padding: 7px 8px; min-height: 32px;
    font: 12px/1.3 var(--serif); background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  }
  .carddetails { margin-top: 5px; }
  .carddetails summary { cursor: pointer; font: 10px/1 var(--mono); color: var(--gold); }
  .carddetails pre {
    white-space: pre-wrap; font: 10px/1.45 var(--mono); color: var(--muted);
    max-height: 180px; overflow: auto; margin: 6px 0 0;
    padding: 8px; background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  dialog {
    width: min(920px, 94vw); max-height: 92vh; padding: 0;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(30, 24, 14, .45); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-head button { margin-left: auto; }
  .dlg-body { padding: 14px; overflow: auto; max-height: calc(92vh - 60px); }
  .dlg-body .art svg { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }
  .dlg-body .note { font-size: 15px; }
  .dlg-body pre { white-space: pre-wrap; font: 11px/1.5 var(--mono); background: var(--field); border: 1px solid var(--line); padding: 10px; overflow: auto; }
  .orderbox { width: 100%; min-height: 260px; font: 11px/1.6 var(--mono); white-space: pre; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    opacity: 0; pointer-events: none; transition: .18s ease;
    background: var(--ink); color: #fbf8ef; font: 12px/1 var(--mono);
    padding: 10px 14px; border-radius: 4px; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 560px) {
    header { padding: 22px 14px 12px; }
    h1 { font-size: 22px; }
    .toolbar { padding: 8px 14px; }
    main { padding: 14px 14px 80px; }
    .board { grid-template-columns: 1fr; }
    .summary { padding: 12px; }
  }
  @media print {
    .toolbar, .summary, .decisions, .moves, .grab, .row, .memo, .carddetails, .toast { display: none !important; }
    body { background: #fff; }
    header { border-bottom: 1px solid #000; }
    .board { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { break-inside: avoid; border-color: #999; }
    .thumb svg { max-height: 240px; }
  }
</style>
</head>
<body>
<header>
  <p style="margin:0 0 8px;font:12px ui-monospace,Menlo,monospace">
    <a href="principles.html" style="color:#8c6a21">Principle cards →</a></p>
  <p class="backrow"><a id="backlink" hidden></a></p>
  <h1 id="title">clothoid ornament board</h1>
  <p class="lead" id="lead"></p>
  <p class="legend" id="legend"></p>
  <p class="subpage" id="subpage" hidden><a id="subpage-link"></a></p>
</header>

<div class="toolbar">
  <span class="groupwrap" id="groupwrap">
    <label for="group">Group</label>
    <select id="group"></select>
  </span>
  <label for="sort">Sort</label>
  <select id="sort">
    <option value="deepseek">DeepSeek pick</option>
    <option value="manual">Manual</option>
    <option value="priority">Priority</option>
    <option value="stage">Stage</option>
  </select>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <button id="copy" class="primary">Copy order</button>
  <button id="export">Export JSON</button>
  <label class="chip" style="cursor:pointer; min-height:34px">Import
    <input id="import" type="file" accept="application/json,.json" hidden>
  </label>
  <button id="reset">Reset</button>
</div>

<main>
  <details class="definitions">
    <summary>Words used on this board — open this if a term is unfamiliar</summary>
    <div class="definition-grid" id="definitiongrid"></div>
  </details>

  <section class="summary" aria-label="summary">
    <div>
      <h2>Next up</h2>
      <div class="nextchips" id="next"></div>
    </div>
    <div id="decisionblock">
      <h2>Decisions</h2>
      <p id="decisionsummary" style="font:12px/1.5 var(--mono); color:var(--muted)"></p>
    </div>
  </section>

  <details class="decisions">
    <summary>Design decisions — click one option per line</summary>
    <div class="decision-grid" id="decisiongrid"></div>
  </details>

  <section class="groupbrief" id="groupbrief" aria-live="polite"></section>

  <section class="board" id="board" aria-live="polite"></section>
</main>

<dialog id="lightbox">
  <div class="dlg-head">
    <span class="pid" id="dlgid"></span>
    <h2 id="dlgtitle"></h2>
    <button id="dlgclose" type="button">Close</button>
  </div>
  <div class="dlg-body" id="dlgbody"></div>
</dialog>

<dialog id="orderdialog">
  <div class="dlg-head">
    <h2>Order</h2>
    <button id="ordercopy" class="primary" type="button">Copy</button>
    <button id="orderclose" type="button">Close</button>
  </div>
  <div class="dlg-body">
    <p style="margin-top:0; color:var(--muted); font:12px/1.5 var(--mono)">Paste this into the session. It keeps the labels and the decisions.</p>
    <textarea id="ordertext" class="orderbox" spellcheck="false"></textarea>
  </div>
</dialog>

<div class="toast" id="toast"></div>

a sudden jerk. The whole project is built on this curve."},{"term":"Curvature","text":"How tightly a curve is bending at one point. A straight line has zero curvature; a small circle has a lot."},{"term":"Curvature rate","text":"How fast the curvature changes as you travel along the curve. A clothoid has a constant curvature rate."},{"term":"Join — G1, G2, G3","text":"A join is where two pieces meet. G1 means they meet in the same direction with no kink. G2 means they also have the same bend, so the bend does not jump. G3 also matches how fast the bend is changing. Higher is smoother; G2 is the normal target here."},{"term":"Corner / point terminal","text":"A deliberate sharp turn between two pieces. A leaf tip is a corner on purpose; an accidental corner is a fault."},{"term":"Terminal","text":"How an open stroke ends: a point, a small arc, a round cap, or a taper. It is a design choice, not leftover geometry."},{"term":"Ribbon, rail, offset","text":"A ribbon is a stroke with width. Its two edges are rails. Each rail is the centre line moved sideways by an offset — half the ribbon width on each side."},{"term":"Fold","text":"When a ribbon is wider than the tightest bend, the inner rail turns back on itself and folds over. The fold radius and margin say when that happens. A fold is allowed only if you chose it."},{"term":"Fit / tolerance","text":"The drawing uses cubic Bézier curves to approximate the exact clothoid. Fit is the measured worst distance between them; tolerance is the limit you accept (0.02 mm by default). Smaller is better."},{"term":"Cap (class I)","text":"A cap turns a ribbon through 180° and brings it back to the centre line, so the ribbon ends in a rounded end instead of a blunt cut."},{"term":"Leaf (class II)","text":"A leaf is two clothoid edges that meet at a point. It has no ribbon width; the point is the design."},{"term":"Euler, arc, spiro","text":"An Euler curve is a clothoid: the bend changes steadily. An arc has constant bend. A spiro is ","nums":"spans 22 · joins G2 1, G1 0, G0 4 points, 5 under the band\nspan error 0.43 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 04: a broad petal and a deep tail, the band set low.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-380 to 70,-25  ->  70,-25\n 2. line 70,-25 to 135,-25  ->  135,-25\n 3. arc r625 -18.0 to -48.0  ->  406.336,-201.216\n 4. arc r625 118.3 to 139.1  ->  265.024,-25.024\n 5. line 265,-25 to 265,25  ->  265,25\n 6. Euler 0 to r625, 10  ->  409.856,187.776\n 7. arc r625 55.0 to 90.0  ->  522.88,546.24\n 8. line 522.88,546.24 to 523,950  ->  523,950\n 9. arc r3125 -120.3 to -102.0  ->  164.992,25.024\n10. line 165,25 to 115,25  ->  115,25\n11. line 115,25 to 0,1150  ->  0,1150\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M175.98932343042821,434.1546762589928C183.60682372055237,400.8992805755396,191.22432401067655,367.64388489208636,198.8418243008007,334.3884892086331C209.9199257282117,331.5467625899281,216.98735058605087,331.5467625899281,224.05477544388998,331.5467625899281C260.5790878495996,339.3142985611511,289.8679935012185,360.029226618705,315.6527793895787,382.23021582733816C304.7931414645468,363.24190647482015,287.1054311245213,347.8664568345324,269.15399791110593,332.41007194244605C262.4068701404201,330.3836930455636,262.4068701404201,325.6954436450839,262.4068701404201,321.0071942446043C269.77643971857526,313.21922196171647,275.9451159003035,307.9080237426849,281.9589184170825,302.46402877697847C285.2180447857769,299.5220659451184,288.4306255422107,296. 6","note":"the petals lean out; the tails answer them. This is one of twenty variations of the same ornament, not a finished piece. Compare it with its neighbours: does the tall centre leaf (the lance) balance the side petals, does the band sit at the right height, and does the foot look heavy enough? Write down the one change you would make next.","nums":"spans 22 · joins G2 1, G1 0, G0 4 points, 5 under the band\nspan error 0.48 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 06: the petals lean out; the tails answer them.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-350 to 70,-25  ->  70,-25\n 2. line 70,-25 to 140,-25  ->  140,-25\n 3. arc r625 -20.0 to -70.0  ->  513.536,-398.528\n 4. arc r625 101.4 to 142.6  ->  280,-25.024\n 5. line 280,-25 to 280,25  ->  280,25\n 6. Euler 0 to r625, 10  ->  438.464,174.528\n 7. arc r625 50.0 to 90.0  ->  584.704,576.256\n 8. line 584.704,576.256 to 585,1000  ->  585,1000\n 9. arc r3125 -122.8 to -103.3  ->  169.984,25.024\n10. line 170,25 to 120,25  ->  120,25\n11. line 120,25 to 0,1160  ->  0,1160\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.48, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M176.41351971625286,420.31114675220533C183.26100563321512,390.4485431702753,190.10849155017735,360.58593958834535,196.9559774671396,330.7233360064154C207.38994366784897,327.9887730553328,214.2374295848112,327.9887730553328,221.08491550177342,327.9887730553328C247.84972877112455,336.1946672012831,271.253390360943,350.8841218925421,290.61756728562483,369.07778668805133C309.9817442103067,387.27145148356055,32 ament, not a finished piece. Compare it with its neighbours: does the tall centre leaf (the lance) balance the side petals, does the band sit at the right height, and does the foot look heavy enough? Write down the one change you would make next.","nums":"spans 22 · joins G2 1, G1 0, G0 4 points, 5 under the band\nspan error 0.43 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 07: a compact piece for a small panel.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-290 to 55,-25  ->  55,-25\n 2. line 55,-25 to 105,-25  ->  105,-25\n 3. arc r625 -15.0 to -53.0  ->  442.368,-252.544\n 4. arc r625 120.5 to 150.7  ->  209.984,-25.024\n 5. line 210,-25 to 210,25  ->  210,25\n 6. Euler 0 to r625, 10  ->  333.952,204.16\n 7. arc r625 62.0 to 90.0  ->  407.104,497.6\n 8. line 407.104,497.6 to 407,760  ->  407,760\n 9. arc r3125 -116.8 to -102.4  ->  145.024,25.024\n10. line 145,25 to 95,25  ->  95,25\n11. line 95,25 to 0,980  ->  0,980\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M175.30968622100957,432.90496495613394C182.34106412005457,403.1374471074515,189.37244201909962,373.36992925876916,196.4038199181446,343.60241141008675C207.49522510231927,340.238200264667,213.8963165075034,340.238200264667,220.2974079126876,340.238200264667C273.32435197817193,355.55236974954664,314.81275579809005,384.57408224280744,353.56616643929055,418.6070675880998C330.0716234652115,387.65794245944227,301.29740791268756,357.625349213351,262.9276944065484,340.7773366661765C255.7817189631651,338.8436341060955,255.7817189631 "a slow, wide petal and a shallow tail. This is one of twenty variations of the same ornament, not a finished piece. Compare it with its neighbours: does the tall centre leaf (the lance) balance the side petals, does the band sit at the right height, and does the foot look heavy enough? Write down the one change you would make next.","nums":"spans 22 · joins G2 1, G1 1, G0 3 points, 5 under the band\nspan error 0.42 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 08: a slow, wide petal and a shallow tail.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-320 to 70,-25  ->  70,-25\n 2. line 70,-25 to 145,-25  ->  145,-25\n 3. arc r625 -10.0 to -35.0  ->  394.944,-128.512\n 4. arc r625 126.1 to 139.0  ->  299.968,-25.024\n 5. line 300,-25 to 300,25  ->  300,25\n 6. Euler 0 to r625, 10  ->  436.096,195.136\n 7. arc r625 58.0 to 90.0  ->  531.072,526.336\n 8. line 531.072,526.336 to 531,1080  ->  531,1080\n 9. arc r3125 -118.9 to -98.4  ->  174.976,25.024\n10. line 175,25 to 120,25  ->  120,25\n11. line 120,25 to 0,1240  ->  0,1240\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G1 G0 (G0) (G0). Span error 0.42, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M176.0882992107972,434.0013633265167C183.59601967288117,406.8957589852574,191.1037401349651,379.79015464399805,198.61146059704907,352.68455030273867C210.5661672194899,350.0204498977505,218.6091730527279,350.0204498977505,226.65217888596592,350.0204498977505C257.2689580235617,350.07337904486945,284.26226695642225,364.84943261558203,309.3537687292691,379.1844099603031C301.9369781539517,369.22711415854684,290.0886423424454,36 25 -109.2 to -88.8  ->  139.968,25.024\n10. line 140,25 to 90,25  ->  90,25\n11. line 90,25 to 0,1280  ->  0,1280\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M174.43029814665593,434.29952456418386C182.74617244157938,409.33016376122555,191.0620467365028,384.3608029582673,199.3779210314263,359.39144215530905C211.72602739726028,356.6545166402536,218.53344077356968,356.6545166402536,225.34085414987914,356.6545166402536C271.3742949234488,365.7303882725832,318.6261079774376,373.4029318541997,352.1676067687349,393.55942947702056C329.17808219178085,379.74405705229793,305.5576148267526,366.0616085578447,275.6422240128928,357.0729001584786C267.2586623690572,355.52720549392495,267.2586623690572,350.98309561542527,267.2586623690572,346.43898573692553C273.1369581069605,338.41002864235196,278.44785141409386,331.8665614728206,283.5036261079774,325.24088748019017C286.22023654019245,321.66181084065073,288.871799697997,318.05457090434805,291.39403706688154,314.41521394611726C292.7606050993476,312.4563182532038,294.08569497337993,310.4879728534415,295.3682514101531,308.5055467511886C297.0157980362958,305.96550356903,298.59251399864127,303.40503164381977,300.0676873489122,300.81774960380346C300.9096870935276,299.3933032007077,301.7103196857686,297.9549892471493,302.4754230459307,296.51188589540413C303.40640436313794,294.7779458570857,304.28876849896596,293.0368523937779,305.11522965350525,291.28209191759106C325.0406929895246,277.09845483359743,327.6261079774376,260.8250792393027,327.6261079774376,244.75435816164816C316.25463336019345,179.23085050184892,316.2256244963739,113.70734284204964,316.1966156325544,48.18383518225036C263.03062046736505,143.49247226624402,237.78565672844476,244.6541204437401,237.78565672844476,346.52614896988905C235.90975020145044,349.8557844690  r625 119.6 to 143.6  ->  270.016,-25.024\n 5. line 270,-25 to 270,25  ->  270,25\n 6. Euler 0 to r625, 10  ->  411.968,190.272\n 7. arc r625 56.0 to 90.0  ->  518.848,539.776\n 8. line 518.848,539.776 to 519,1000  ->  519,1000\n 9. arc r3125 -119.3 to -100.3  ->  168,25.024\n10. line 168,25 to 115,25  ->  115,25\n11. line 115,25 to 0,1180  ->  0,1180\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M175.9812974868498,434.0090497737557C183.21215663354764,404.31975867269983,190.44301578024545,374.6304675716441,197.67387492694328,344.94117647058823C208.9304500292227,342.11764705882354,216.16832261835185,342.11764705882354,223.406195207481,342.11764705882354C265.2238457042665,351.0113122171946,298.8094681472823,372.6651583710407,328.3974284044419,398.11764705882354C315.71011104617185,376.0542986425339,294.88018702513153,358.0950226244344,271.2098188194039,342.8235294117647C264.6452367036821,340.94720965309205,264.6452367036821,336.2292609351433,264.6452367036821,331.51131221719453C271.9112002597264,323.62555124952104,278.0151994853354,318.18823931585865,283.9602571595558,312.6153846153846C287.18269639171984,309.61021872877814,290.3571502596079,306.5595216099559,293.4494447691409,303.45701357466066C295.1276474289136,301.7813659687606,296.7758345282392,300.09322756419033,298.39392168322615,298.38914027149326C300.48377862006106,296.19250039393313,302.52638358088444,293.96818745884866,304.5166569257744,291.710407239819C305.6210338316155,290.45360997271894,306.7097614608056,289.18772758554525,307.7779076563413,287.9095022624435C309.06466929539823,286.3776022632128,310.32270303761925,284.828501565138,311.54412624196374,283.2579185520362C341.85797779076563,257.05656108597293,354.676797194623,221.85294117647067,354.676797194623,185.93665158371044C346.4850964348334 ound on r25.\n\nRight half, in order:\n 1. line 0,-330 to 70,-25  ->  70,-25\n 2. line 70,-25 to 140,-25  ->  140,-25\n 3. arc r625 -18.0 to -62.0  ->  498.688,-326.016\n 4. arc r625 107.7 to 141.8  ->  289.984,-25.024\n 5. line 290,-25 to 290,25  ->  290,25\n 6. Euler 0 to r625, 10  ->  426.112,195.136\n 7. arc r625 58.0 to 90.0  ->  521.088,526.336\n 8. line 521.088,526.336 to 521,720  ->  521,720\n 9. arc r3125 -124.0 to -109.6  ->  169.984,25.024\n10. line 170,25 to 120,25  ->  120,25\n11. line 120,25 to 0,940  ->  0,940\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.59, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M176.01723535577037,432.7360015676285C183.6543612437405,398.4924639527099,191.2914871317107,364.24892633779126,198.9286130196809,330.0053887228727C210.57645277745428,326.72904521628374,218.22056597181788,326.72904521628374,225.86467916618145,326.72904521628374C278.2170723186212,344.4579434673982,322.7244672178875,380.4977220398765,346.96168626994296,430.3434086121589C334.13299173168747,390.6392984862588,306.9925468731804,357.9459168177142,277.514848026086,327.6343506588938C270.89088156515663,325.3351622332174,270.89088156515663,319.71652051797054,270.89088156515663,314.09787880272376C277.7983703203188,304.59986459102856,283.65614891672936,297.9102359472177,289.3583323628741,291.0772546906383C292.43720622611295,287.3730622597047,295.4745984517525,283.628680333234,298.4348433678817,279.8256013324842C300.0312959275218,277.7712445341752,301.6041082807549,275.70312447196824,303.15127518341683,273.6177925831578C305.13832174713644,270.9279779586216,307.08217128051626,268.20761084536974,308.97868871550014,265.44848870817617C310.02135626751584,263.9139799417766,311.05420059443946,262.3684238672195,312.06009083498316,260.81418703767207C313.2853218644461,258.9396674624446,314.4752913022423,257.0  G2 1, G1 0, G0 4 points, 5 under the band\nspan error 0.43 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 18: a broad foot, a low band, a steady piece.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-370 to 80,-25  ->  80,-25\n 2. line 80,-25 to 135,-25  ->  135,-25\n 3. arc r625 -16.0 to -52.0  ->  455.232,-241.024\n 4. arc r625 118.6 to 145.6  ->  260.032,-25.024\n 5. line 260,-25 to 260,25  ->  260,25\n 6. Euler 0 to r625, 10  ->  377.6,208.384\n 7. arc r625 64.0 to 90.0  ->  440.832,482.368\n 8. line 440.832,482.368 to 441,900  ->  441,900\n 9. arc r3125 -116.0 to -99.1  ->  164.032,25.024\n10. line 164,25 to 118,25  ->  118,25\n11. line 118,25 to 0,1080  ->  0,1080\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M175.46057870984868,433.5957281887865C185.4154499601805,399.5532971607384,195.37032121051237,365.51086613269024,205.3251924608442,331.46843510464214C216.70560127422354,328.5884075445698,223.54658879745153,328.5884075445698,230.3875763206796,328.5884075445698C278.341186620653,343.5427611747481,323.38299707990444,361.9834639565929,353.62091850278733,393.95745413831713C337.2282320148659,367.8240461631212,311.0578709848686,345.8306778055292,279.7000265463234,329.2515717853759C272.38916910007964,327.36313266155656,272.38916910007964,322.424138030029,272.38916910007964,317.48514339850146C279.14910968117715,308.9158719205916,285.0139701939435,302.5141894481284,290.69020440668965,295.9986219963827C293.7466545760444,292.4726977604272,296.7557812309719,288.91229411792887,299.67348022298 ":"plate","group":"fleur-studies","groupLabel":"FLEUR STUDY","title":"Fleur study 20","note":"the last of the first hand: balanced, and quiet. This is one of twenty variations of the same ornament, not a finished piece. Compare it with its neighbours: does the tall centre leaf (the lance) balance the side petals, does the band sit at the right height, and does the foot look heavy enough? Write down the one change you would make next.","nums":"spans 22 · joins G2 1, G1 0, G0 4 points, 5 under the band\nspan error 0.43 u · copy 2.18 u · fold 625 u","prompt":"A fleur study 20: the last of the first hand: balanced, and quiet.\n\nSolid ink #2E2413 on paper #F6F1E4, exactly symmetric about x = 0, with a gold #8C6A21 band. The piece is one closed chain, traversed counter-clockwise from the foot; the left half is the mirror. Three points above, three below; the band's two ends are round on r25.\n\nRight half, in order:\n 1. line 0,-340 to 65,-25  ->  65,-25\n 2. line 65,-25 to 125,-25  ->  125,-25\n 3. arc r625 -15.0 to -50.0  ->  441.984,-226.944\n 4. arc r625 120.1 to 145.5  ->  254.976,-25.024\n 5. line 255,-25 to 255,25  ->  255,25\n 6. Euler 0 to r625, 10  ->  375.808,206.336\n 7. arc r625 63.0 to 90.0  ->  443.904,490.112\n 8. line 443.904,490.112 to 444,980  ->  444,980\n 9. arc r3125 -115.7 to -97.4  ->  160,25.024\n10. line 160,25 to 110,25  ->  110,25\n11. line 110,25 to 0,1160  ->  0,1160\n\nJoins: (G0) G0 G0 (G0) (G0) G2 G0 G0 (G0) (G0). Span error 0.43, copy error 2.18 at a half width of 12.5, fold radius 625.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 440\"><rect width=\"360\" height=\"440\" fill=\"#fff\"></rect><path d=\"M175.34335635920357,433.9673278879813C183.592035757822,403.8834250152803,191.8407151564405,373.79952214257935,200.08939455505893,343.7156192698783C212.38520926452665,340.85514252375395,220.00000000000003,340.85514252375395,227.6147907354734,340.85514252375395C277.61885412433975,350.1516919486581,322.3140999593661,370. =\"#3A2E1A\" stroke-width=\".7\"></rect><rect x=\"347.10199106054444\" y=\"223.11800135197106\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><path d=\"M349.10199106054444 196.85947657942984 L349.11418122714343 150.0741790298383 M349.1385615603413 56.50358393065509 L349.1263713937424 103.28888148024669\" stroke=\"#3A2E1A\" stroke-width=\".6\" opacity=\".5\"></path><rect x=\"347.11418122714343\" y=\"148.0741790298383\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><rect x=\"347.1263713937424\" y=\"101.28888148024669\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><path d=\"M349.15075172694026 56.494415735956 L293.864295546996 142.76040877055001 M240.9508329947176 330.1100183363894 L257.32539020137364 235.1409732556552\" stroke=\"#3A2E1A\" stroke-width=\".6\" opacity=\".5\"></path><rect x=\"291.864295546996\" y=\"140.76040877055001\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><rect x=\"255.32539020137364\" y=\"233.1409732556552\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><path d=\"M240.9508329947176 330.1168944824137 L234.6017878911012 330.1168944824137 M221.90369768386833 330.1168944824137 L228.25274278748475 330.1168944824137\" stroke=\"#3A2E1A\" stroke-width=\".6\" opacity=\".5\"></path><rect x=\"232.6017878911012\" y=\"328.1168944824137\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><rect x=\"226.25274278748475\" y=\"328.1168944824137\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><path d=\"M221.90369768386833 330.1168944824137 L207.93579845591222 221.72209257098405 M180 4.932488748124655 L193.9678992279561 113.32729065955434\" stroke=\"#3A2E1A\" stroke-width=\".6\" opacity=\".5\"></path><rect x=\"205.93579845591222\" y=\"219.72209257098405\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect><rect x=\"191.9678992279561\" y=\"111.32729065955434\" width=\"4\" height=\"4\" fill=\"#fff\" stroke=\"#3A2E1A\" stroke-width=\".7\"></rect></g></svg>","pick":21.9}]}</script>
<script>
(() => {
  "use strict";

  const DATA = JSON.parse(document.getElementById("seed").textContent);
  const KEY = DATA.storageKey;
  const VERSION = DATA.version;
  const STAGES = [
    ["foundational", "Foundational"],
    ["reopened", "Reopened"],
    ["sketch", "Sketch"],
    ["finished", "Finished"],
  ];
  const PRIORITY_WORDS = { 1: "next", 2: "high", 3: "medium", 4: "low", 5: "someday" };
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));

  const defaults = () => Object.fromEntries(DATA.decisions.map((d) => [d.id, d.default]));

  function seedState() {
    return {
      version: VERSION,
      sort: "deepseek",
      group: "all",
      decisions: defaults(),
      items: DATA.items.map((item, index) => ({
        id: item.id,
        priority: null,
        stage: DATA.mode === "fleur"
          ? "sketch"
          : (item.kind === "work" && item.id === "W02"
            ? "reopened"
            : (item.kind === "work" && ["W01", "W11", "W12"].includes(item.id)
              ? "finished"
              : (item.kind === "work" && ["W01", "W03", "W04"].includes(item.id)
                ? "foundational" : null))),
        noteEdit: "",
        order: index,
      })),
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return seedState();
      const saved = JSON.parse(raw);
      if (!saved || saved.version !== VERSION || !Array.isArray(saved.items)) return seedState();
      const byId = new Map(saved.items.map((it) => [it.id, it]));
      const items = DATA.items.map((item, index) => {
        const old = byId.get(item.id);
        return {
          id: item.id,
          priority: Number.isInteger(old?.priority) ? old.priority : null,
          stage: STAGES.some(([s]) => s === old?.stage) ? old.stage : null,
          noteEdit: typeof old?.noteEdit === "string" ? old.noteEdit : "",
          order: Number.isFinite(old?.order) ? old.order : index,
        };
      }).sort((a, b) => a.order - b.order).map((it, i) => ({ ...it, order: i }));
      return {
        version: VERSION,
        sort: ["deepseek", "manual", "priority", "stage"].includes(saved.sort) ? saved.sort : "deepseek",
        group: DATA.groups.some((g) => g.value === saved.group) ? saved.group : "all",
        decisions: { ...defaults(), ...(saved.decisions || {}) },
        items,
      };
    } catch {
      return seedState();
    }
  }

  let state = loadState();
  const itemById = new Map(DATA.items.map((item) => [item.id, item]));

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* file:// may refuse */ }
  }

  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 1600);
  }

  function stageRank(entry) {
    const index = STAGES.findIndex(([value]) => value === entry.stage);
    return index < 0 ? 99 : index;
  }

  function visibleItems() {
    let list = state.items.filter((it) => {
      const item = itemById.get(it.id);
      if (state.group === "all") return true;
      if (state.group === "plates") return item.kind === "plate";
      if (state.group === "work") return item.kind === "work";
      return item.group === state.group;
    });
    if (state.sort === "deepseek") {
      list = list.slice().sort((a, b) =>
        (itemById.get(a.id).pick ?? 999) - (itemById.get(b.id).pick ?? 999) ||
        a.order - b.order);
    } else if (state.sort === "priority") {
      list = list.slice().sort((a, b) =>
        (a.priority ?? 99) - (b.priority ?? 99) || a.order - b.order);
    } else if (state.sort === "stage") {
      list = list.slice().sort((a, b) =>
        stageRank(a) - stageRank(b) ||
        (a.priority ?? 99) - (b.priority ?? 99) ||
        a.order - b.order);
    } else {
      list = list.slice().sort((a, b) => a.order - b.order);
    }
    return list;
  }

  function renderDecisions() {
    $("#decisiongrid").innerHTML = DATA.decisions.map((d) => `
      <div class="decision" data-decision="${d.id}">
        <div class="did">${d.id}</div>
        <h3>${esc(d.title)}</h3>
        <p>${esc(d.note)}</p>
        <div class="opts">
          ${d.options.map((o) => `
            <button class="opt" type="button" data-opt="${esc(o.value)}"
              aria-pressed="${state.decisions[d.id] === o.value}">${esc(o.label)}</button>
          `).join("")}
        </div>
      </div>
    `).join("");
  }

  function thumbMarkup(item) {
    if (item.svg) return item.svg;
    return item.icon || `<div style="padding:40px;text-align:center;color:var(--muted);font:12px var(--mono)">no image</div>`;
  }

  function priorityButtons(id) {
    const item = state.items.find((it) => it.id === id);
    return [1, 2, 3, 4, 5].map((n) => `
      <button type="button" data-priority="${n}" data-id="${id}"
        title="${PRIORITY_WORDS[n]}"
        aria-pressed="${item.priority === n}">${n}</button>
    `).join("");
  }

  function stageButtons(id) {
    const item = state.items.find((it) => it.id === id);
    const stages = DATA.mode === "fleur"
      ? STAGES.filter(([value]) => value !== "foundational")
      : STAGES;
    return stages.map(([value, label]) => {
      const text = DATA.mode === "fleur"
        ? (value === "sketch" ? "Needs work" : "Ready")
        : label;
      return `
      <button type="button" class="stage ${value}" data-stage="${value}" data-id="${id}"
        aria-pressed="${item.stage === value}">${text}</button>
    `;
    }).join("");
  }

  function cardMarkup(entry) {
    const item = itemById.get(entry.id);
    const stats = item.nums ? `<p class="stats">${esc(item.nums).replace(/\n/g, " · ")}</p>` : "";
    const prompt = item.prompt
      ? `<details class="carddetails"><summary>prompt &amp; numbers</summary><pre>${esc(item.prompt)}</pre></details>`
      : "";
    return `
      <article class="card" data-id="${entry.id}">
        <div class="card-top">
          <span class="pid">${entry.id}</span>
          <span class="kind">${esc(item.groupLabel || (item.kind === "plate" ? "plate" : "work"))}</span>
          <span class="grab" draggable="true" title="drag to reorder">⋮⋮</span>
          <div class="moves">
            <button type="button" data-move="-1" data-id="${entry.id}" title="move up" aria-label="move up">↑</button>
            <button type="button" data-move="1" data-id="${entry.id}" title="move down" aria-label="move down">↓</button>
          </div>
        </div>
        <button class="thumb" type="button" data-open="${entry.id}" aria-label="open ${esc(item.title)}">
          ${thumbMarkup(item)}
        </button>
        <h3>${esc(item.title)}</h3>
        <textarea class="note-edit" data-note="${entry.id}" spellcheck="false"
          draggable="false" aria-label="brief for ${entry.id}">${esc(entry.noteEdit || item.note)}</textarea>
        <button class="note-reset" type="button" data-reset-note="${entry.id}"
          ${entry.noteEdit ? "" : "hidden"}>reset text</button>
        ${stats}
        <div class="row">
          <span class="rowlabel">Priority</span>
          <div class="seg">${priorityButtons(entry.id)}</div>
        </div>
        <div class="row">
          <span class="rowlabel">Stage</span>
          <div class="seg">${stageButtons(entry.id)}</div>
        </div>
        ${prompt}
      </article>
    `;
  }

  function sizeNote(el) {
    if (!el) return;
    el.style.height = "auto";
    const height = Math.min(el.scrollHeight, 280);
    el.style.height = height + "px";
    el.style.overflow = el.scrollHeight > 280 ? "auto" : "hidden";
  }

  function renderBoard() {
    const list = visibleItems();
    $("#board").innerHTML = list.length
      ? list.map(cardMarkup).join("")
      : `<p class="empty">Nothing in this filter.</p>`;
    const plates = state.items.filter((it) => itemById.get(it.id).kind === "plate").length;
    const work = state.items.filter((it) => itemById.get(it.id).kind === "work").length;
    const ranked = state.items.filter((it) => it.priority !== null).length;
    if (DATA.mode === "fleur") {
      const need = state.items.filter((it) => it.stage === "sketch").length;
      const ready = state.items.filter((it) => it.stage === "finished").length;
      $("#count").textContent = `${plates} studies · ${need} need work · ${ready} ready`;
    } else {
      $("#count").textContent = `${plates} plates · ${work} work · ${ranked} ranked`;
    }
    document.querySelectorAll(".note-edit").forEach(sizeNote);
  }

  function renderSummary() {
    const ranked = state.items
      .filter((it) => it.priority !== null)
      .sort((a, b) => a.priority - b.priority || a.order - b.order)
      .slice(0, 8);
    $("#next").innerHTML = ranked.length
      ? ranked.map((it) => `<span class="chip"><b>${it.id}</b> ${esc(itemById.get(it.id).title)}</span>`).join("")
      : `<span class="chip" style="color:var(--muted)">No priorities yet — click 1–5 on a card.</span>`;
    $("#decisionsummary").textContent = DATA.decisions
      .map((d) => {
        const value = state.decisions[d.id];
        const option = d.options.find((o) => o.value === value);
        return `${d.id} ${option ? option.label : "—"}`;
      })
      .join(" · ");
  }

  function renderGroupBrief() {
    const key = DATA.mode === "fleur"
      ? "fleur-studies"
      : (state.group === "plates" ? "all" : state.group);
    const brief = (DATA.groupBriefs || {})[key] || (DATA.groupBriefs || {}).all;
    if (!brief) {
      $("#groupbrief").hidden = true;
      return;
    }
    $("#groupbrief").hidden = false;
    $("#groupbrief").innerHTML = `<h2>${esc(brief.title)}</h2><p>${esc(brief.text)}</p>`;
  }

  function renderChrome() {
    $("#group").innerHTML = DATA.groups
      .map((g) => `<option value="${esc(g.value)}">${esc(g.label)}</option>`)
      .join("");
    $("#group").value = state.group;
    $("#sort").value = state.sort;
  }

  function renderAll() {
    renderChrome();
    renderDecisions();
    renderBoard();
    renderSummary();
    renderGroupBrief();
  }

  function setPriority(id, value) {
    const entry = state.items.find((it) => it.id === id);
    entry.priority = entry.priority === value ? null : value;
    save();
    if (state.sort === "manual" || state.sort === "stage") {
      syncCard(id);
    } else {
      renderBoard();
    }
    renderSummary();
  }

  function setStage(id, value) {
    const entry = state.items.find((it) => it.id === id);
    entry.stage = entry.stage === value ? null : value;
    save();
    if (state.sort === "manual" || state.sort === "priority") {
      syncCard(id);
    } else {
      renderBoard();
    }
    renderSummary();
  }

  function syncCard(id) {
    const card = document.querySelector(`.card[data-id="${id}"]`);
    const entry = state.items.find((it) => it.id === id);
    if (!card || !entry) return;
    card.querySelectorAll("[data-priority]").forEach((button) => {
      button.setAttribute("aria-pressed", String(Number(button.dataset.priority) === entry.priority));
    });
    card.querySelectorAll("[data-stage]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.stage === entry.stage));
    });
  }

  function move(id, direction) {
    const visible = visibleItems().map((it) => it.id);
    const vIndex = visible.indexOf(id);
    if (vIndex < 0) return;
    const nextVisible = visible[vIndex + direction];
    if (!nextVisible) return;
    const from = state.items.findIndex((it) => it.id === id);
    const to = state.items.findIndex((it) => it.id === nextVisible);
    const [entry] = state.items.splice(from, 1);
    state.items.splice(to, 0, entry);
    state.items.forEach((it, i) => { it.order = i; });
    state.sort = "manual";
    save(); renderChrome(); renderBoard();
  }

  function openLightbox(id) {
    const item = itemById.get(id);
    const entry = state.items.find((it) => it.id === id);
    const note = entry?.noteEdit || item.note;
    $("#dlgid").textContent = id;
    $("#dlgtitle").textContent = item.title;
    const stats = item.nums ? `<p class="stats" style="font-size:11px">${esc(item.nums).replace(/\n/g, "<br>")}</p>` : "";
    const prompt = item.prompt ? `<h3 style="margin-top:18px">Prompt</h3><pre>${esc(item.prompt)}</pre>` : "";
    $("#dlgbody").innerHTML = `
      <div class="art">${thumbMarkup(item)}</div>
      <p class="note">${esc(note)}</p>
      ${stats}
      ${prompt}
    `;
    $("#lightbox").showModal();
  }

  function orderText() {
    const lines = [];
    lines.push(DATA.title);
    lines.push(`exported ${new Date().toISOString().slice(0, 10)}`);
    if (DATA.decisions.length) {
      lines.push("");
      lines.push("DECISIONS");
      for (const d of DATA.decisions) {
        const value = state.decisions[d.id];
        const option = d.options.find((o) => o.value === value);
        lines.push(`${d.id}  ${d.title}: ${option ? option.label : "—"}`);
      }
    }
    lines.push("");
    lines.push("ORDER");
    visibleItems().forEach((it, index) => {
      const item = itemById.get(it.id);
      const priority = it.priority ? `p${it.priority}` : "p—";
      const stage = it.stage || "—";
      lines.push(`${String(index + 1).padStart(2, "0")}. ${it.id}  [${priority} · ${stage}]  ${item.title}`);
      if (it.noteEdit) lines.push(`      ${it.noteEdit}`);
    });
    return lines.join("\n");
  }

  function downloadJSON() {
    const payload = {
      version: VERSION,
      exported: new Date().toISOString(),
      decisions: state.decisions,
      items: state.items.map((it) => {
        const item = itemById.get(it.id);
        return { ...it, title: item.title };
      }),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = DATA.exportName || "ornament-board.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("JSON exported");
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(String(reader.result));
        if (!Array.isArray(payload.items)) throw new Error("items missing");
        const byId = new Map(payload.items.map((it) => [it.id, it]));
        const items = DATA.items.map((item, index) => {
          const old = byId.get(item.id);
          return {
            id: item.id,
            priority: Number.isInteger(old?.priority) ? old.priority : null,
            stage: STAGES.some(([s]) => s === old?.stage) ? old.stage : null,
            noteEdit: typeof old?.noteEdit === "string" ? old.noteEdit : "",
            order: Number.isFinite(old?.order) ? old.order : index,
          };
        }).sort((a, b) => a.order - b.order).map((it, i) => ({ ...it, order: i }));
        state = {
          version: VERSION,
          sort: state.sort,
          group: state.group,
          decisions: { ...defaults(), ...(payload.decisions || {}) },
          items,
        };
        save(); renderAll(); toast("Imported");
      } catch (error) {
        toast("Import failed: " + error.message);
      }
    };
    reader.readAsText(file);
  }

  // Delegated interactions
  document.addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target) return;
    const resetNote = target.dataset.resetNote;
    if (resetNote) {
      const entry = state.items.find((it) => it.id === resetNote);
      const item = itemById.get(resetNote);
      entry.noteEdit = "";
      save();
      const card = target.closest(".card");
      const note = card.querySelector(".note-edit");
      if (note) {
        note.value = item.note;
        sizeNote(note);
      }
      target.hidden = true;
      return;
    }
    const priority = target.dataset.priority;
    if (priority) { setPriority(target.dataset.id, Number(priority)); return; }
    const stage = target.dataset.stage;
    if (stage) { setStage(target.dataset.id, stage); return; }
    const moveDir = target.dataset.move;
    if (moveDir) { move(target.dataset.id, Number(moveDir)); return; }
    const open = target.dataset.open;
    if (open) { openLightbox(open); return; }
    const opt = target.dataset.opt;
    if (opt) {
      const box = target.closest("[data-decision]");
      state.decisions[box.dataset.decision] = opt;
      save(); renderDecisions(); renderSummary();
      return;
    }
  });

  document.addEventListener("input", (event) => {
    const id = event.target.dataset.note;
    if (!id) return;
    const entry = state.items.find((it) => it.id === id);
    const item = itemById.get(id);
    entry.noteEdit = event.target.value === item.note ? "" : event.target.value;
    save();
    sizeNote(event.target);
    const reset = event.target.closest(".card")?.querySelector(".note-reset");
    if (reset) reset.hidden = !entry.noteEdit;
  });

  $("#group").addEventListener("change", (event) => {
    state.group = event.target.value; save(); renderBoard(); renderGroupBrief();
  });
  $("#sort").addEventListener("change", (event) => {
    state.sort = event.target.value; save(); renderBoard();
  });

  $("#copy").addEventListener("click", () => {
    const text = orderText();
    $("#ordertext").value = text;
    $("#orderdialog").showModal();
    setTimeout(() => $("#ordertext").select(), 50);
  });
  $("#ordercopy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("#ordertext").value);
      toast("Copied");
    } catch {
      $("#ordertext").select();
      document.execCommand("copy");
      toast("Copied");
    }
  });
  $("#orderclose").addEventListener("click", () => $("#orderdialog").close());
  $("#export").addEventListener("click", downloadJSON);
  $("#import").addEventListener("change", (event) => {
    const file = event.target.files?.[0];
    if (file) importJSON(file);
    event.target.value = "";
  });
  $("#reset").addEventListener("click", () => {
    if (!confirm("Clear every priority, stage and note on this board?")) return;
    state = seedState();
    try { localStorage.removeItem(KEY); } catch { /* no-op */ }
    renderAll();
    toast("Reset");
  });
  $("#dlgclose").addEventListener("click", () => $("#lightbox").close());
  $("#lightbox").addEventListener("click", (event) => {
    if (event.target === $("#lightbox")) $("#lightbox").close();
  });
  $("#orderdialog").addEventListener("click", (event) => {
    if (event.target === $("#orderdialog")) $("#orderdialog").close();
  });

  // Drag and drop reordering
  let dragged = null;
  document.addEventListener("dragstart", (event) => {
    if (!event.target.closest?.(".grab")) return;
    const card = event.target.closest(".card");
    if (!card) return;
    dragged = card.dataset.id;
    card.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
  });
  document.addEventListener("dragend", () => {
    dragged = null;
    document.querySelectorAll(".card").forEach((c) => c.classList.remove("dragging", "drop-target"));
  });
  document.addEventListener("dragover", (event) => {
    const card = event.target.closest?.(".card");
    if (!card || !dragged || card.dataset.id === dragged) return;
    event.preventDefault();
    document.querySelectorAll(".drop-target").forEach((c) => c.classList.remove("drop-target"));
    card.classList.add("drop-target");
  });
  document.addEventListener("drop", (event) => {
    const card = event.target.closest?.(".card");
    if (!card || !dragged) return;
    event.preventDefault();
    if (card.dataset.id === dragged) return;
    const from = state.items.findIndex((it) => it.id === dragged);
    const to = state.items.findIndex((it) => it.id === card.dataset.id);
    const [entry] = state.items.splice(from, 1);
    state.items.splice(to, 0, entry);
    state.items.forEach((it, i) => { it.order = i; });
    state.sort = "manual";
    dragged = null;
    save(); renderChrome(); renderBoard();
  });

  function renderDefinitions() {
    const grid = $("#definitiongrid");
    if (!grid) return;
    grid.innerHTML = (DATA.definitions || [])
      .map((d) => `<div class="def"><b>${esc(d.term)}</b><p>${esc(d.text)}</p></div>`)
      .join("");
  }

  function initPage() {
    document.title = DATA.title;
    $("#title").textContent = DATA.title;
    $("#lead").innerHTML = DATA.lead;
    $("#legend").innerHTML = DATA.legend;
    renderDefinitions();
    const defs = document.querySelector(".definitions");
    if (defs && window.innerWidth < 700) defs.open = false;
    if (DATA.back) {
      const back = $("#backlink");
      back.href = DATA.back.href;
      back.textContent = DATA.back.label;
      back.hidden = false;
    }
    if (DATA.subpage) {
      const link = $("#subpage-link");
      link.href = DATA.subpage.href;
      link.textContent = DATA.subpage.label;
      $("#subpage").hidden = false;
    }
    if (!DATA.decisions.length) {
      document.querySelector(".decisions").hidden = true;
      $("#decisionblock").hidden = true;
    }
    if (!DATA.groups || DATA.groups.length <= 1) {
      $("#groupwrap").hidden = true;
    }
  }

  initPage();
  renderAll();
})();
</script>
</body>
</html>
